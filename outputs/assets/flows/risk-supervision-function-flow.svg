<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">风险监管｜功能流程图</title>
  <desc id="desc">预警研判、风险升级、整改提交与监管复核的状态闭环</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55738f"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#31834f"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c43d3d"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1f2937;letter-spacing:0}.title{font-size:30px;font-weight:700;fill:#111827}.subtitle{font-size:15px;fill:#667085}.lane{font-size:16px;font-weight:700;fill:#475467}.node-title{font-size:17px;font-weight:700}.node-sub{font-size:13px;fill:#667085}.decision{font-size:16px;font-weight:700}.edge{stroke:#55738f;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.edge-green{stroke:#31834f;stroke-width:2.3;fill:none;marker-end:url(#arrowGreen)}.edge-red{stroke:#c43d3d;stroke-width:2.3;fill:none;marker-end:url(#arrowRed)}.edge-dash{stroke:#667085;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.label{font-size:13px;font-weight:700;fill:#475467}.note{font-size:13px;fill:#667085}
    </style>
  </defs>
  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="60" y="52" class="title">风险监管｜功能流程图</text>
  <text x="60" y="80" class="subtitle">预警研判、风险升级、整改提交与监管复核的状态闭环</text><g><rect x="44" y="105" width="1512" height="665" rx="8" fill="#fafbfc" stroke="#d0d5dd"/><text x="64" y="135" class="lane">预警与风险事件闭环</text></g><g><rect x="70" y="185" width="220" height="90" rx="7" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><rect x="70" y="185" width="7" height="90" rx="3" fill="#d59b2d"/><text x="180" y="215" text-anchor="middle" class="node-title"><tspan x="180" dy="0">生成待研判预警</tspan></text><text x="180" y="238" text-anchor="middle" class="node-sub"><tspan x="180" dy="0">规则命中</tspan><tspan x="180" dy="18">固化证据快照</tspan></text></g><g><rect x="345" y="185" width="220" height="90" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="345" y="185" width="7" height="90" rx="3" fill="#4f8fc5"/><text x="455" y="215" text-anchor="middle" class="node-title"><tspan x="455" dy="0">查看风险与证据</tspan></text><text x="455" y="238" text-anchor="middle" class="node-sub"><tspan x="455" dy="0">证据图、来源、时间线</tspan></text></g><g><polygon points="720,170 815,230 720,290 625,230" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><text x="720" y="225" text-anchor="middle" class="decision"><tspan x="720" dy="0">研判</tspan><tspan x="720" dy="21">处理方式</tspan></text></g><g><rect x="900" y="120" width="220" height="82" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="900" y="120" width="7" height="82" rx="3" fill="#4f8fc5"/><text x="1010" y="150" text-anchor="middle" class="node-title"><tspan x="1010" dy="0">转派处理人</tspan></text><text x="1010" y="173" text-anchor="middle" class="node-sub"><tspan x="1010" dy="0">状态保持待研判</tspan></text></g><g><rect x="900" y="245" width="220" height="82" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="900" y="245" width="7" height="82" rx="3" fill="#4c9a6a"/><text x="1010" y="275" text-anchor="middle" class="node-title"><tspan x="1010" dy="0">解除预警</tspan></text><text x="1010" y="298" text-anchor="middle" class="node-sub"><tspan x="1010" dy="0">状态：已解除</tspan></text></g><g><rect x="900" y="370" width="220" height="82" rx="7" fill="#fff1f1" stroke="#d45454" stroke-width="2"/><rect x="900" y="370" width="7" height="82" rx="3" fill="#d45454"/><text x="1010" y="400" text-anchor="middle" class="node-title"><tspan x="1010" dy="0">升级风险事件</tspan></text><text x="1010" y="423" text-anchor="middle" class="node-sub"><tspan x="1010" dy="0">状态：已升级</tspan></text></g><g><rect x="1180" y="370" width="220" height="82" rx="7" fill="#fff1f1" stroke="#d45454" stroke-width="2"/><rect x="1180" y="370" width="7" height="82" rx="3" fill="#d45454"/><text x="1290" y="400" text-anchor="middle" class="node-title"><tspan x="1290" dy="0">风险事件待整改</tspan></text><text x="1290" y="423" text-anchor="middle" class="node-sub"><tspan x="1290" dy="0">责任人、时限、要求</tspan></text></g><g><rect x="1180" y="515" width="220" height="82" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="1180" y="515" width="7" height="82" rx="3" fill="#4f8fc5"/><text x="1290" y="545" text-anchor="middle" class="node-title"><tspan x="1290" dy="0">提交整改</tspan></text><text x="1290" y="568" text-anchor="middle" class="node-sub"><tspan x="1290" dy="0">说明、结果、材料</tspan></text></g><g><polygon points="1450,498 1540,556 1450,614 1360,556" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><text x="1450" y="551" text-anchor="middle" class="decision"><tspan x="1450" dy="0">监管</tspan><tspan x="1450" dy="21">复核</tspan></text></g><g><rect x="1280" y="675" width="220" height="78" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="1280" y="675" width="7" height="78" rx="3" fill="#4c9a6a"/><text x="1390" y="705" text-anchor="middle" class="node-title"><tspan x="1390" dy="0">风险事件已关闭</tspan></text><text x="1390" y="728" text-anchor="middle" class="node-sub"><tspan x="1390" dy="0">通过 / 不成立</tspan></text></g><g><path d="M290 230 L345 230" class="edge"/></g><g><path d="M565 230 L625 230" class="edge"/></g><g><path d="M720 170 C760 145 820 150 900 161" class="edge"/><rect x="792" y="128" width="56" height="22" rx="11" fill="#fff"/><text x="820" y="143" text-anchor="middle" class="label">转派</text></g><g><path d="M815 230 L900 286" class="edge-green"/><rect x="833.5" y="240" width="48" height="22" rx="11" fill="#fff"/><text x="857.5" y="255" text-anchor="middle" class="label">解除</text></g><g><path d="M720 290 C760 380 820 410 900 411" class="edge-red"/><rect x="792" y="373" width="56" height="22" rx="11" fill="#fff"/><text x="820" y="388" text-anchor="middle" class="label">升级</text></g><g><path d="M1010 120 C1010 70 455 80 455 185" class="edge-dash"/><rect x="702" y="58" width="56" height="22" rx="11" fill="#fff"/><text x="730" y="73" text-anchor="middle" class="label">重新研判</text></g><g><path d="M1120 411 L1180 411" class="edge"/></g><g><path d="M1290 452 L1290 515" class="edge"/></g><g><path d="M1400 556 L1360 556" class="edge"/></g><g><path d="M1450 614 L1450 675" class="edge-green"/><rect x="1452" y="628" width="56" height="22" rx="11" fill="#fff"/><text x="1480" y="643" text-anchor="middle" class="label">通过</text></g><g><path d="M1360 580 C1290 640 1200 640 1200 597" class="edge-red"/><rect x="1252" y="625" width="56" height="22" rx="11" fill="#fff"/><text x="1280" y="640" text-anchor="middle" class="label">退回</text></g><text x="70" y="810" text-anchor="start" class="note"><tspan x="70" dy="0">预警状态：待研判 → 已解除 / 已升级；风险事件状态：待整改 ⇄ 待复核 → 已关闭。</tspan></text>
</svg>
