<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">场景与规则｜功能流程图</title>
  <desc id="desc">场景版本与独立规则资产的配置、校验、试跑和发布流程</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55738f"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#31834f"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c43d3d"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1f2937;letter-spacing:0}.title{font-size:30px;font-weight:700;fill:#111827}.subtitle{font-size:15px;fill:#667085}.lane{font-size:16px;font-weight:700;fill:#475467}.node-title{font-size:17px;font-weight:700}.node-sub{font-size:13px;fill:#667085}.decision{font-size:16px;font-weight:700}.edge{stroke:#55738f;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.edge-green{stroke:#31834f;stroke-width:2.3;fill:none;marker-end:url(#arrowGreen)}.edge-red{stroke:#c43d3d;stroke-width:2.3;fill:none;marker-end:url(#arrowRed)}.edge-dash{stroke:#667085;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.label{font-size:13px;font-weight:700;fill:#475467}.note{font-size:13px;fill:#667085}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="60" y="52" class="title">场景与规则｜功能流程图</text>
  <text x="60" y="80" class="subtitle">场景版本与独立规则资产的配置、校验、试跑和发布流程</text><g><rect x="44" y="105" width="1512" height="560" rx="8" fill="#fafbfc" stroke="#d0d5dd"/><text x="64" y="135" class="lane">配置发布流程</text></g><g><rect x="65" y="315" width="155" height="58" rx="29" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><text x="142.5" y="350" text-anchor="middle" class="node-title"><tspan x="142.5" dy="0">新建 / 复制场景</tspan></text></g><g><rect x="260" y="285" width="220" height="118" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="260" y="285" width="7" height="118" rx="3" fill="#4f8fc5"/><text x="370" y="315" text-anchor="middle" class="node-title"><tspan x="370" dy="0">配置场景草稿</tspan></text><text x="370" y="338" text-anchor="middle" class="node-sub"><tspan x="370" dy="0">监管领域、适用范围</tspan><tspan x="370" dy="18">主对象、目标事件</tspan></text></g><g><rect x="530" y="285" width="220" height="118" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="530" y="285" width="7" height="118" rx="3" fill="#4c9a6a"/><text x="640" y="315" text-anchor="middle" class="node-title"><tspan x="640" dy="0">绑定规则资产</tspan></text><text x="640" y="338" text-anchor="middle" class="node-sub"><tspan x="640" dy="0">选择已有规则版本</tspan><tspan x="640" dy="18">或新建独立规则</tspan></text></g><g><rect x="800" y="285" width="220" height="118" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="800" y="285" width="7" height="118" rx="3" fill="#4f8fc5"/><text x="910" y="315" text-anchor="middle" class="node-title"><tspan x="910" dy="0">配置依据与证据</tspan></text><text x="910" y="338" text-anchor="middle" class="node-sub"><tspan x="910" dy="0">制度条款、证据要求</tspan><tspan x="910" dy="18">运行和失败策略</tspan></text></g><g><polygon points="1160,286 1250,344 1160,402 1070,344" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><text x="1160" y="339" text-anchor="middle" class="decision"><tspan x="1160" dy="0">依赖校验</tspan><tspan x="1160" dy="21">是否通过？</tspan></text></g><g><rect x="1320" y="205" width="210" height="90" rx="7" fill="#fff1f1" stroke="#d45454" stroke-width="2"/><rect x="1320" y="205" width="7" height="90" rx="3" fill="#d45454"/><text x="1425" y="235" text-anchor="middle" class="node-title"><tspan x="1425" dy="0">修复配置问题</tspan></text><text x="1425" y="258" text-anchor="middle" class="node-sub"><tspan x="1425" dy="0">定位场景或规则字段</tspan></text></g><g><rect x="1320" y="380" width="210" height="90" rx="7" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><rect x="1320" y="380" width="7" height="90" rx="3" fill="#d59b2d"/><text x="1425" y="410" text-anchor="middle" class="node-title"><tspan x="1425" dy="0">执行试跑</tspan></text><text x="1425" y="433" text-anchor="middle" class="node-sub"><tspan x="1425" dy="0">样本命中与证据结果</tspan></text></g><g><polygon points="1160,482 1250,540 1160,598 1070,540" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><text x="1160" y="535" text-anchor="middle" class="decision"><tspan x="1160" dy="0">试跑结果</tspan><tspan x="1160" dy="21">是否通过？</tspan></text></g><g><rect x="800" y="500" width="220" height="82" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="800" y="500" width="7" height="82" rx="3" fill="#4c9a6a"/><text x="910" y="530" text-anchor="middle" class="node-title"><tspan x="910" dy="0">发布场景版本</tspan></text><text x="910" y="553" text-anchor="middle" class="node-sub"><tspan x="910" dy="0">固化规则版本引用</tspan></text></g><g><rect x="530" y="500" width="220" height="82" rx="7" fill="#f7f8fa" stroke="#98a2b3" stroke-width="2"/><rect x="530" y="500" width="7" height="82" rx="3" fill="#98a2b3"/><text x="640" y="530" text-anchor="middle" class="node-title"><tspan x="640" dy="0">不可变已发布版本</tspan></text><text x="640" y="553" text-anchor="middle" class="node-sub"><tspan x="640" dy="0">修改时复制新草稿</tspan></text></g><g><path d="M220 344 L260 344" class="edge"/></g><g><path d="M480 344 L530 344" class="edge"/></g><g><path d="M750 344 L800 344" class="edge"/></g><g><path d="M1020 344 L1070 344" class="edge"/></g><g><path d="M1160 286 C1210 230 1260 245 1320 250" class="edge-red"/><rect x="1232" y="218" width="56" height="22" rx="11" fill="#fff"/><text x="1260" y="233" text-anchor="middle" class="label">否</text></g><g><path d="M1320 250 C1220 130 900 150 900 285" class="edge-dash"/><rect x="1082" y="128" width="56" height="22" rx="11" fill="#fff"/><text x="1110" y="143" text-anchor="middle" class="label">修复后重试</text></g><g><path d="M1160 402 C1210 440 1260 425 1320 425" class="edge"/><rect x="1222" y="408" width="56" height="22" rx="11" fill="#fff"/><text x="1250" y="423" text-anchor="middle" class="label">是</text></g><g><path d="M1425 470 C1425 520 1300 540 1250 540" class="edge"/></g><g><path d="M1070 540 L1020 540" class="edge-green"/><rect x="1021" y="522" width="48" height="22" rx="11" fill="#fff"/><text x="1045" y="537" text-anchor="middle" class="label">是</text></g><g><path d="M800 540 L750 540" class="edge"/></g><g><path d="M1160 598 C1110 655 900 650 900 582" class="edge-red"/><rect x="1002" y="628" width="56" height="22" rx="11" fill="#fff"/><text x="1030" y="643" text-anchor="middle" class="label">否</text></g><text x="70" y="710" text-anchor="start" class="note"><tspan x="70" dy="0">规则资产独立版本化；从场景移出规则只解除绑定；已发布场景和规则版本只读。</tspan></text>
</svg>
