<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">穿透式监管平台｜核心业务流程</title>
  <desc id="desc">从监管资产准备、风险识别到整改复核闭环的完整业务流程</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55738f"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#31834f"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c43d3d"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1f2937;letter-spacing:0}.title{font-size:30px;font-weight:700;fill:#111827}.subtitle{font-size:15px;fill:#667085}.lane{font-size:16px;font-weight:700;fill:#475467}.node-title{font-size:17px;font-weight:700}.node-sub{font-size:13px;fill:#667085}.decision{font-size:16px;font-weight:700}.edge{stroke:#55738f;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.edge-green{stroke:#31834f;stroke-width:2.3;fill:none;marker-end:url(#arrowGreen)}.edge-red{stroke:#c43d3d;stroke-width:2.3;fill:none;marker-end:url(#arrowRed)}.edge-dash{stroke:#667085;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.label{font-size:13px;font-weight:700;fill:#475467}.note{font-size:13px;fill:#667085}
    </style>
  </defs>
  <rect width="1600" height="940" fill="#ffffff"/>
  <text x="60" y="52" class="title">穿透式监管平台｜核心业务流程</text>
  <text x="60" y="80" class="subtitle">从监管资产准备、风险识别到整改复核闭环的完整业务流程</text><g><rect x="44" y="105" width="1512" height="205" rx="8" fill="#fafbfc" stroke="#d0d5dd"/><text x="64" y="135" class="lane">监管资产准备</text></g><g><rect x="75" y="165" width="190" height="82" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="75" y="165" width="7" height="82" rx="3" fill="#4c9a6a"/><text x="170" y="195" text-anchor="middle" class="node-title"><tspan x="170" dy="0">发布本体</tspan></text><text x="170" y="218" text-anchor="middle" class="node-sub"><tspan x="170" dy="0">类、属性、关系、事件</tspan></text></g><g><rect x="305" y="165" width="190" height="82" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="305" y="165" width="7" height="82" rx="3" fill="#4c9a6a"/><text x="400" y="195" text-anchor="middle" class="node-title"><tspan x="400" dy="0">数据源与映射</tspan></text><text x="400" y="218" text-anchor="middle" class="node-sub"><tspan x="400" dy="0">登记来源、语义映射</tspan></text></g><g><rect x="535" y="165" width="190" height="82" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="535" y="165" width="7" height="82" rx="3" fill="#4c9a6a"/><text x="630" y="195" text-anchor="middle" class="node-title"><tspan x="630" dy="0">发布图谱</tspan></text><text x="630" y="218" text-anchor="middle" class="node-sub"><tspan x="630" dy="0">固化来源与映射快照</tspan></text></g><g><rect x="765" y="165" width="190" height="82" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="765" y="165" width="7" height="82" rx="3" fill="#4c9a6a"/><text x="860" y="195" text-anchor="middle" class="node-title"><tspan x="860" dy="0">规则资产</tspan></text><text x="860" y="218" text-anchor="middle" class="node-sub"><tspan x="860" dy="0">独立版本化、可复用</tspan></text></g><g><rect x="995" y="165" width="190" height="82" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="995" y="165" width="7" height="82" rx="3" fill="#4c9a6a"/><text x="1090" y="195" text-anchor="middle" class="node-title"><tspan x="1090" dy="0">场景绑定</tspan></text><text x="1090" y="218" text-anchor="middle" class="node-sub"><tspan x="1090" dy="0">范围、事件、证据、规则</tspan></text></g><g><rect x="1225" y="165" width="250" height="82" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="1225" y="165" width="7" height="82" rx="3" fill="#4c9a6a"/><text x="1350" y="195" text-anchor="middle" class="node-title"><tspan x="1350" dy="0">校验 / 试跑 / 发布</tspan></text><text x="1350" y="218" text-anchor="middle" class="node-sub"><tspan x="1350" dy="0">形成不可变运行版本</tspan></text></g><g><path d="M265 206 L305 206" class="edge"/></g><g><path d="M495 206 L535 206" class="edge"/></g><g><path d="M725 206 L765 206" class="edge"/></g><g><path d="M955 206 L995 206" class="edge"/></g><g><path d="M1185 206 L1225 206" class="edge"/></g><g><rect x="44" y="330" width="1512" height="250" rx="8" fill="#fafbfc" stroke="#d0d5dd"/><text x="64" y="360" class="lane">风险识别与预警研判</text></g><g><rect x="90" y="410" width="210" height="82" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="90" y="410" width="7" height="82" rx="3" fill="#4f8fc5"/><text x="195" y="440" text-anchor="middle" class="node-title"><tspan x="195" dy="0">事件或扫描触发</tspan></text><text x="195" y="463" text-anchor="middle" class="node-sub"><tspan x="195" dy="0">异步、非阻断</tspan></text></g><g><polygon points="470,395 565,451 470,507 375,451" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><text x="470" y="446" text-anchor="middle" class="decision"><tspan x="470" dy="0">规则</tspan><tspan x="470" dy="21">是否命中？</tspan></text></g><g><rect x="650" y="355" width="220" height="74" rx="7" fill="#f7f8fa" stroke="#98a2b3" stroke-width="2"/><rect x="650" y="355" width="7" height="74" rx="3" fill="#98a2b3"/><text x="760" y="385" text-anchor="middle" class="node-title"><tspan x="760" dy="0">记录运行结果</tspan></text><text x="760" y="408" text-anchor="middle" class="node-sub"><tspan x="760" dy="0">未命中，不生成预警</tspan></text></g><g><rect x="650" y="475" width="260" height="86" rx="7" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><rect x="650" y="475" width="7" height="86" rx="3" fill="#d59b2d"/><text x="780" y="495" text-anchor="middle" class="node-title"><tspan x="780" dy="0">生成待研判预警</tspan><tspan x="780" dy="21">固化证据快照</tspan></text><text x="780" y="539" text-anchor="middle" class="node-sub"><tspan x="780" dy="0">规则、图谱、来源版本</tspan></text></g><g><polygon points="1080,462 1175,518 1080,574 985,518" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><text x="1080" y="513" text-anchor="middle" class="decision"><tspan x="1080" dy="0">人工</tspan><tspan x="1080" dy="21">研判结论</tspan></text></g><g><rect x="1260" y="370" width="230" height="76" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="1260" y="370" width="7" height="76" rx="3" fill="#4c9a6a"/><text x="1375" y="400" text-anchor="middle" class="node-title"><tspan x="1375" dy="0">解除预警</tspan></text><text x="1375" y="423" text-anchor="middle" class="node-sub"><tspan x="1375" dy="0">生成规则效果样本</tspan></text></g><g><rect x="1260" y="500" width="230" height="88" rx="7" fill="#fff1f1" stroke="#d45454" stroke-width="2"/><rect x="1260" y="500" width="7" height="88" rx="3" fill="#d45454"/><text x="1375" y="530" text-anchor="middle" class="node-title"><tspan x="1375" dy="0">升级风险事件</tspan></text><text x="1375" y="553" text-anchor="middle" class="node-sub"><tspan x="1375" dy="0">指定责任人和时限</tspan></text></g><g><path d="M300 451 L375 451" class="edge"/></g><g><path d="M565 425 L650 392" class="edge"/><rect x="583.5" y="390.5" width="48" height="22" rx="11" fill="#fff"/><text x="607.5" y="405.5" text-anchor="middle" class="label">否</text></g><g><path d="M565 477 L650 518" class="edge"/><rect x="583.5" y="479.5" width="48" height="22" rx="11" fill="#fff"/><text x="607.5" y="494.5" text-anchor="middle" class="label">是</text></g><g><path d="M910 518 L985 518" class="edge"/></g><g><path d="M1080 462 C1120 410 1180 408 1260 408" class="edge-green"/><rect x="1140" y="392" width="56" height="22" rx="11" fill="#fff"/><text x="1168" y="407" text-anchor="middle" class="label">解除</text></g><g><path d="M1175 518 L1260 544" class="edge-red"/><rect x="1193.5" y="513" width="48" height="22" rx="11" fill="#fff"/><text x="1217.5" y="528" text-anchor="middle" class="label">升级</text></g><g><rect x="44" y="600" width="1512" height="270" rx="8" fill="#fafbfc" stroke="#d0d5dd"/><text x="64" y="630" class="lane">整改复核闭环</text></g><g><rect x="790" y="665" width="220" height="82" rx="7" fill="#fff1f1" stroke="#d45454" stroke-width="2"/><rect x="790" y="665" width="7" height="82" rx="3" fill="#d45454"/><text x="900" y="695" text-anchor="middle" class="node-title"><tspan x="900" dy="0">风险事件待整改</tspan></text><text x="900" y="718" text-anchor="middle" class="node-sub"><tspan x="900" dy="0">责任人在线整改</tspan></text></g><g><rect x="1050" y="665" width="220" height="82" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="1050" y="665" width="7" height="82" rx="3" fill="#4f8fc5"/><text x="1160" y="695" text-anchor="middle" class="node-title"><tspan x="1160" dy="0">提交整改</tspan></text><text x="1160" y="718" text-anchor="middle" class="node-sub"><tspan x="1160" dy="0">说明、结果、证明材料</tspan></text></g><g><polygon points="1410,650 1505,706 1410,762 1315,706" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><text x="1410" y="701" text-anchor="middle" class="decision"><tspan x="1410" dy="0">监管</tspan><tspan x="1410" dy="21">复核结论</tspan></text></g><g><rect x="1260" y="805" width="230" height="72" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="1260" y="805" width="7" height="72" rx="3" fill="#4c9a6a"/><text x="1375" y="835" text-anchor="middle" class="node-title"><tspan x="1375" dy="0">风险事件已关闭</tspan></text><text x="1375" y="858" text-anchor="middle" class="node-sub"><tspan x="1375" dy="0">通过或不成立</tspan></text></g><g><path d="M1375 588 C1320 630 1130 620 1010 706" class="edge-red"/></g><g><path d="M1010 706 L1050 706" class="edge"/></g><g><path d="M1270 706 L1315 706" class="edge"/></g><g><path d="M1410 762 L1410 805" class="edge-green"/><rect x="1412" y="768" width="56" height="22" rx="11" fill="#fff"/><text x="1440" y="783" text-anchor="middle" class="label">通过</text></g><g><path d="M1315 730 C1220 790 1080 790 1080 747" class="edge-red"/><rect x="1167" y="773" width="56" height="22" rx="11" fill="#fff"/><text x="1195" y="788" text-anchor="middle" class="label">退回</text></g><text x="72" y="910" text-anchor="start" class="note"><tspan x="72" dy="0">发布版本不可覆盖；证据快照不可被当前图谱替代；状态、待办、消息和审计在试点前统一服务端事务化。</tspan></text>
</svg>
