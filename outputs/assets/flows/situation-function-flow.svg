<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">监管态势｜功能流程图</title>
  <desc id="desc">统一统计快照驱动的筛选、分析与风险下钻流程</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55738f"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#31834f"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c43d3d"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1f2937;letter-spacing:0}.title{font-size:30px;font-weight:700;fill:#111827}.subtitle{font-size:15px;fill:#667085}.lane{font-size:16px;font-weight:700;fill:#475467}.node-title{font-size:17px;font-weight:700}.node-sub{font-size:13px;fill:#667085}.decision{font-size:16px;font-weight:700}.edge{stroke:#55738f;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.edge-green{stroke:#31834f;stroke-width:2.3;fill:none;marker-end:url(#arrowGreen)}.edge-red{stroke:#c43d3d;stroke-width:2.3;fill:none;marker-end:url(#arrowRed)}.edge-dash{stroke:#667085;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.label{font-size:13px;font-weight:700;fill:#475467}.note{font-size:13px;fill:#667085}
    </style>
  </defs>
  <rect width="1600" height="720" fill="#ffffff"/>
  <text x="60" y="52" class="title">监管态势｜功能流程图</text>
  <text x="60" y="80" class="subtitle">统一统计快照驱动的筛选、分析与风险下钻流程</text><g><rect x="44" y="108" width="1512" height="520" rx="8" fill="#fafbfc" stroke="#d0d5dd"/><text x="64" y="138" class="lane">态势分析流程</text></g><g><rect x="75" y="300" width="160" height="58" rx="29" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><text x="155" y="335" text-anchor="middle" class="node-title"><tspan x="155" dy="0">进入监管态势</tspan></text></g><g><rect x="275" y="275" width="230" height="108" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="275" y="275" width="7" height="108" rx="3" fill="#4f8fc5"/><text x="390" y="305" text-anchor="middle" class="node-title"><tspan x="390" dy="0">加载授权数据</tspan></text><text x="390" y="328" text-anchor="middle" class="node-sub"><tspan x="390" dy="0">统一统计快照</tspan><tspan x="390" dy="18">指标口径与截止时间</tspan></text></g><g><rect x="555" y="275" width="230" height="108" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="555" y="275" width="7" height="108" rx="3" fill="#4f8fc5"/><text x="670" y="305" text-anchor="middle" class="node-title"><tspan x="670" dy="0">设置全局筛选</tspan></text><text x="670" y="328" text-anchor="middle" class="node-sub"><tspan x="670" dy="0">时间、组织、领域</tspan><tspan x="670" dy="18">等级、监管阶段</tspan></text></g><g><rect x="835" y="180" width="250" height="92" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="835" y="180" width="7" height="92" rx="3" fill="#4c9a6a"/><text x="960" y="210" text-anchor="middle" class="node-title"><tspan x="960" dy="0">核心指标</tspan></text><text x="960" y="233" text-anchor="middle" class="node-sub"><tspan x="960" dy="0">预警、事件、逾期、闭环率</tspan></text></g><g><rect x="835" y="310" width="250" height="92" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="835" y="310" width="7" height="92" rx="3" fill="#4f8fc5"/><text x="960" y="340" text-anchor="middle" class="node-title"><tspan x="960" dy="0">趋势与分布</tspan></text><text x="960" y="363" text-anchor="middle" class="node-sub"><tspan x="960" dy="0">时间、等级、组织、领域</tspan></text></g><g><rect x="835" y="440" width="250" height="92" rx="7" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><rect x="835" y="440" width="7" height="92" rx="3" fill="#d59b2d"/><text x="960" y="470" text-anchor="middle" class="node-title"><tspan x="960" dy="0">重点事项</tspan></text><text x="960" y="493" text-anchor="middle" class="node-sub"><tspan x="960" dy="0">重大高风险、逾期事项</tspan></text></g><g><polygon points="1235,296 1330,356 1235,416 1140,356" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><text x="1235" y="351" text-anchor="middle" class="decision"><tspan x="1235" dy="0">是否需要</tspan><tspan x="1235" dy="21">下钻核查？</tspan></text></g><g><rect x="1390" y="220" width="155" height="90" rx="7" fill="#f7f8fa" stroke="#98a2b3" stroke-width="2"/><rect x="1390" y="220" width="7" height="90" rx="3" fill="#98a2b3"/><text x="1467.5" y="250" text-anchor="middle" class="node-title"><tspan x="1467.5" dy="0">调整筛选</tspan></text><text x="1467.5" y="273" text-anchor="middle" class="node-sub"><tspan x="1467.5" dy="0">继续分析</tspan></text></g><g><rect x="1360" y="420" width="185" height="90" rx="7" fill="#fff1f1" stroke="#d45454" stroke-width="2"/><rect x="1360" y="420" width="7" height="90" rx="3" fill="#d45454"/><text x="1452.5" y="450" text-anchor="middle" class="node-title"><tspan x="1452.5" dy="0">风险监管列表</tspan></text><text x="1452.5" y="473" text-anchor="middle" class="node-sub"><tspan x="1452.5" dy="0">携带全部筛选条件</tspan></text></g><g><path d="M235 329 L275 329" class="edge"/></g><g><path d="M505 329 L555 329" class="edge"/></g><g><path d="M785 329 C810 260 810 226 835 226" class="edge"/></g><g><path d="M785 329 L835 356" class="edge"/></g><g><path d="M785 329 C810 430 810 486 835 486" class="edge"/></g><g><path d="M1085 226 C1140 250 1150 300 1140 330" class="edge"/></g><g><path d="M1085 356 L1140 356" class="edge"/></g><g><path d="M1085 486 C1140 450 1150 410 1140 380" class="edge"/></g><g><path d="M1330 330 C1360 290 1370 270 1390 265" class="edge"/><rect x="1332" y="269" width="56" height="22" rx="11" fill="#fff"/><text x="1360" y="284" text-anchor="middle" class="label">否</text></g><g><path d="M1330 385 C1360 430 1360 455 1360 465" class="edge-red"/><rect x="1332" y="413" width="56" height="22" rx="11" fill="#fff"/><text x="1360" y="428" text-anchor="middle" class="label">是</text></g><g><path d="M1465 220 C1465 130 670 130 670 275" class="edge-dash"/><rect x="1052" y="111" width="56" height="22" rx="11" fill="#fff"/><text x="1080" y="126" text-anchor="middle" class="label">重新分析</text></g><text x="70" y="675" text-anchor="start" class="note"><tspan x="70" dy="0">指标、图表和重点事项必须使用同一筛选与统计快照；单个图表失败时只影响该区域。</tspan></text>
</svg>
