<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">监管工作台｜功能流程图</title>
  <desc id="desc">统计卡、待办和监管通知驱动的个人任务处理流程</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55738f"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#31834f"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c43d3d"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1f2937;letter-spacing:0}.title{font-size:30px;font-weight:700;fill:#111827}.subtitle{font-size:15px;fill:#667085}.lane{font-size:16px;font-weight:700;fill:#475467}.node-title{font-size:17px;font-weight:700}.node-sub{font-size:13px;fill:#667085}.decision{font-size:16px;font-weight:700}.edge{stroke:#55738f;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.edge-green{stroke:#31834f;stroke-width:2.3;fill:none;marker-end:url(#arrowGreen)}.edge-red{stroke:#c43d3d;stroke-width:2.3;fill:none;marker-end:url(#arrowRed)}.edge-dash{stroke:#667085;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.label{font-size:13px;font-weight:700;fill:#475467}.note{font-size:13px;fill:#667085}
    </style>
  </defs>
  <rect width="1600" height="720" fill="#ffffff"/>
  <text x="60" y="52" class="title">监管工作台｜功能流程图</text>
  <text x="60" y="80" class="subtitle">统计卡、待办和监管通知驱动的个人任务处理流程</text><g><rect x="44" y="108" width="1512" height="520" rx="8" fill="#fafbfc" stroke="#d0d5dd"/><text x="64" y="138" class="lane">用户工作流</text></g><g><rect x="80" y="310" width="150" height="58" rx="29" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><text x="155" y="345" text-anchor="middle" class="node-title"><tspan x="155" dy="0">进入工作台</tspan></text></g><g><rect x="275" y="285" width="220" height="108" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="275" y="285" width="7" height="108" rx="3" fill="#4f8fc5"/><text x="385" y="315" text-anchor="middle" class="node-title"><tspan x="385" dy="0">权限校验与加载</tspan></text><text x="385" y="338" text-anchor="middle" class="node-sub"><tspan x="385" dy="0">统计卡、待办、通知</tspan></text></g><g><rect x="545" y="285" width="230" height="108" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="545" y="285" width="7" height="108" rx="3" fill="#4f8fc5"/><text x="660" y="315" text-anchor="middle" class="node-title"><tspan x="660" dy="0">展示工作台</tspan></text><text x="660" y="338" text-anchor="middle" class="node-sub"><tspan x="660" dy="0">6张统计卡</tspan><tspan x="660" dy="18">左右分栏工作区</tspan></text></g><g><polygon points="930,280 1025,339 930,398 835,339" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><text x="930" y="334" text-anchor="middle" class="decision"><tspan x="930" dy="0">选择</tspan><tspan x="930" dy="21">处理入口</tspan></text></g><g><rect x="1090" y="185" width="250" height="90" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="1090" y="185" width="7" height="90" rx="3" fill="#4f8fc5"/><text x="1215" y="215" text-anchor="middle" class="node-title"><tspan x="1215" dy="0">统计卡 / 查询条件</tspan></text><text x="1215" y="238" text-anchor="middle" class="node-sub"><tspan x="1215" dy="0">筛选我的待办</tspan></text></g><g><rect x="1090" y="315" width="250" height="90" rx="7" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><rect x="1090" y="315" width="7" height="90" rx="3" fill="#d59b2d"/><text x="1215" y="345" text-anchor="middle" class="node-title"><tspan x="1215" dy="0">待办列表</tspan></text><text x="1215" y="368" text-anchor="middle" class="node-sub"><tspan x="1215" dy="0">查看、处理、转派</tspan></text></g><g><rect x="1090" y="445" width="250" height="90" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="1090" y="445" width="7" height="90" rx="3" fill="#4c9a6a"/><text x="1215" y="475" text-anchor="middle" class="node-title"><tspan x="1215" dy="0">监管通知</tspan></text><text x="1215" y="498" text-anchor="middle" class="node-sub"><tspan x="1215" dy="0">已读、来源跳转</tspan></text></g><g><rect x="1380" y="315" width="160" height="90" rx="7" fill="#fff1f1" stroke="#d45454" stroke-width="2"/><rect x="1380" y="315" width="7" height="90" rx="3" fill="#d45454"/><text x="1460" y="345" text-anchor="middle" class="node-title"><tspan x="1460" dy="0">来源对象</tspan></text><text x="1460" y="368" text-anchor="middle" class="node-sub"><tspan x="1460" dy="0">预警 / 事件</tspan></text></g><g><path d="M230 339 L275 339" class="edge"/></g><g><path d="M495 339 L545 339" class="edge"/></g><g><path d="M775 339 L835 339" class="edge"/></g><g><path d="M930 280 C980 225 1030 225 1090 230" class="edge"/><rect x="992" y="208" width="56" height="22" rx="11" fill="#fff"/><text x="1020" y="223" text-anchor="middle" class="label">筛选</text></g><g><path d="M1025 339 L1090 360" class="edge"/><rect x="1033.5" y="331.5" width="48" height="22" rx="11" fill="#fff"/><text x="1057.5" y="346.5" text-anchor="middle" class="label">待办</text></g><g><path d="M930 398 C980 485 1030 490 1090 490" class="edge"/><rect x="992" y="469" width="56" height="22" rx="11" fill="#fff"/><text x="1020" y="484" text-anchor="middle" class="label">通知</text></g><g><path d="M1340 360 L1380 360" class="edge"/></g><g><path d="M1460 405 C1460 600 650 620 650 393" class="edge-green"/><rect x="1012" y="593" width="56" height="22" rx="11" fill="#fff"/><text x="1040" y="608" text-anchor="middle" class="label">完成后刷新</text></g><text x="70" y="675" text-anchor="start" class="note"><tspan x="70" dy="0">区域加载失败时局部重试，不阻塞其他区域；返回工作台时恢复筛选、分页和滚动位置。</tspan></text>
</svg>
