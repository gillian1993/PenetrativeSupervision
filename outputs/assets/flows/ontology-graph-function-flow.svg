<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">本体与图谱｜功能流程图</title>
  <desc id="desc">从语义定义、数据接入到图谱质量治理与版本发布的流程</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55738f"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#31834f"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c43d3d"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1f2937;letter-spacing:0}.title{font-size:30px;font-weight:700;fill:#111827}.subtitle{font-size:15px;fill:#667085}.lane{font-size:16px;font-weight:700;fill:#475467}.node-title{font-size:17px;font-weight:700}.node-sub{font-size:13px;fill:#667085}.decision{font-size:16px;font-weight:700}.edge{stroke:#55738f;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.edge-green{stroke:#31834f;stroke-width:2.3;fill:none;marker-end:url(#arrowGreen)}.edge-red{stroke:#c43d3d;stroke-width:2.3;fill:none;marker-end:url(#arrowRed)}.edge-dash{stroke:#667085;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.label{font-size:13px;font-weight:700;fill:#475467}.note{font-size:13px;fill:#667085}
    </style>
  </defs>
  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="60" y="52" class="title">本体与图谱｜功能流程图</text>
  <text x="60" y="80" class="subtitle">从语义定义、数据接入到图谱质量治理与版本发布的流程</text><g><rect x="44" y="105" width="1512" height="620" rx="8" fill="#fafbfc" stroke="#d0d5dd"/><text x="64" y="135" class="lane">语义与数据资产生产流程</text></g><g><rect x="65" y="180" width="210" height="96" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="65" y="180" width="7" height="96" rx="3" fill="#4c9a6a"/><text x="170" y="210" text-anchor="middle" class="node-title"><tspan x="170" dy="0">本体草稿</tspan></text><text x="170" y="233" text-anchor="middle" class="node-sub"><tspan x="170" dy="0">类、属性、关系、事件</tspan></text></g><g><rect x="325" y="180" width="210" height="96" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="325" y="180" width="7" height="96" rx="3" fill="#4c9a6a"/><text x="430" y="210" text-anchor="middle" class="node-title"><tspan x="430" dy="0">本体校验与发布</tspan></text><text x="430" y="233" text-anchor="middle" class="node-sub"><tspan x="430" dy="0">形成不可变语义版本</tspan></text></g><g><rect x="585" y="180" width="210" height="96" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="585" y="180" width="7" height="96" rx="3" fill="#4f8fc5"/><text x="690" y="210" text-anchor="middle" class="node-title"><tspan x="690" dy="0">登记数据源</tspan></text><text x="690" y="233" text-anchor="middle" class="node-sub"><tspan x="690" dy="0">连接配置、凭据加密</tspan></text></g><g><rect x="845" y="180" width="210" height="96" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="845" y="180" width="7" height="96" rx="3" fill="#4f8fc5"/><text x="950" y="210" text-anchor="middle" class="node-title"><tspan x="950" dy="0">测试与解析元数据</tspan></text><text x="950" y="233" text-anchor="middle" class="node-sub"><tspan x="950" dy="0">表、接口、字段、结构版本</tspan></text></g><g><rect x="1105" y="180" width="210" height="96" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="1105" y="180" width="7" height="96" rx="3" fill="#4f8fc5"/><text x="1210" y="210" text-anchor="middle" class="node-title"><tspan x="1210" dy="0">语义映射</tspan></text><text x="1210" y="233" text-anchor="middle" class="node-sub"><tspan x="1210" dy="0">来源字段 → 本体元素</tspan></text></g><g><rect x="1365" y="180" width="170" height="96" rx="7" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><rect x="1365" y="180" width="7" height="96" rx="3" fill="#d59b2d"/><text x="1450" y="210" text-anchor="middle" class="node-title"><tspan x="1450" dy="0">同步事实</tspan></text><text x="1450" y="233" text-anchor="middle" class="node-sub"><tspan x="1450" dy="0">幂等与去重</tspan></text></g><g><rect x="1105" y="390" width="210" height="96" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="1105" y="390" width="7" height="96" rx="3" fill="#4c9a6a"/><text x="1210" y="420" text-anchor="middle" class="node-title"><tspan x="1210" dy="0">创建图谱版本</tspan></text><text x="1210" y="443" text-anchor="middle" class="node-sub"><tspan x="1210" dy="0">固化本体、来源和映射</tspan></text></g><g><polygon points="850,379 940,438 850,497 760,438" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><text x="850" y="433" text-anchor="middle" class="decision"><tspan x="850" dy="0">质量校验</tspan><tspan x="850" dy="21">是否通过？</tspan></text></g><g><rect x="565" y="390" width="210" height="96" rx="7" fill="#fff1f1" stroke="#d45454" stroke-width="2"/><rect x="565" y="390" width="7" height="96" rx="3" fill="#d45454"/><text x="670" y="420" text-anchor="middle" class="node-title"><tspan x="670" dy="0">实体关系治理</tspan></text><text x="670" y="443" text-anchor="middle" class="node-sub"><tspan x="670" dy="0">合并、保持独立、拆分</tspan></text></g><g><rect x="285" y="390" width="210" height="96" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="285" y="390" width="7" height="96" rx="3" fill="#4c9a6a"/><text x="390" y="420" text-anchor="middle" class="node-title"><tspan x="390" dy="0">发布图谱版本</tspan></text><text x="390" y="443" text-anchor="middle" class="node-sub"><tspan x="390" dy="0">供规则运行与证据引用</tspan></text></g><g><rect x="70" y="410" width="160" height="58" rx="29" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><text x="150" y="445" text-anchor="middle" class="node-title"><tspan x="150" dy="0">完成发布</tspan></text></g><g><path d="M275 228 L325 228" class="edge"/></g><g><path d="M535 228 L585 228" class="edge"/></g><g><path d="M795 228 L845 228" class="edge"/></g><g><path d="M1055 228 L1105 228" class="edge"/></g><g><path d="M1315 228 L1365 228" class="edge"/></g><g><path d="M1450 276 L1450 330 C1450 380 1350 438 1315 438" class="edge"/></g><g><path d="M1105 438 L940 438" class="edge"/></g><g><path d="M760 438 L775 438" class="edge-red"/><rect x="743.5" y="420" width="48" height="22" rx="11" fill="#fff"/><text x="767.5" y="435" text-anchor="middle" class="label">否</text></g><g><path d="M565 438 L495 438" class="edge"/></g><g><path d="M285 438 L230 438" class="edge"/></g><g><path d="M670 390 C670 330 850 330 850 379" class="edge-dash"/><rect x="732" y="313" width="56" height="22" rx="11" fill="#fff"/><text x="760" y="328" text-anchor="middle" class="label">治理后重校验</text></g><g><path d="M850 497 C790 565 410 565 390 486" class="edge-green"/><rect x="592" y="548" width="56" height="22" rx="11" fill="#fff"/><text x="620" y="563" text-anchor="middle" class="label">是</text></g><text x="70" y="770" text-anchor="start" class="note"><tspan x="70" dy="0">图谱发布时固化依赖快照；阻断级质量问题未解决不得发布；历史证据引用具体图谱版本。</tspan></text>
</svg>
