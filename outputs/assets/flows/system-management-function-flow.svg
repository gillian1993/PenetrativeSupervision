<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740" role="img" aria-labelledby="title desc">
  <title id="title">系统管理｜功能流程图</title>
  <desc id="desc">组织用户、角色权限和统一审计的管理与校验流程</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55738f"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#31834f"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c43d3d"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1f2937;letter-spacing:0}.title{font-size:30px;font-weight:700;fill:#111827}.subtitle{font-size:15px;fill:#667085}.lane{font-size:16px;font-weight:700;fill:#475467}.node-title{font-size:17px;font-weight:700}.node-sub{font-size:13px;fill:#667085}.decision{font-size:16px;font-weight:700}.edge{stroke:#55738f;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.edge-green{stroke:#31834f;stroke-width:2.3;fill:none;marker-end:url(#arrowGreen)}.edge-red{stroke:#c43d3d;stroke-width:2.3;fill:none;marker-end:url(#arrowRed)}.edge-dash{stroke:#667085;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.label{font-size:13px;font-weight:700;fill:#475467}.note{font-size:13px;fill:#667085}
    </style>
  </defs>
  <rect width="1600" height="740" fill="#ffffff"/>
  <text x="60" y="52" class="title">系统管理｜功能流程图</text>
  <text x="60" y="80" class="subtitle">组织用户、角色权限和统一审计的管理与校验流程</text><g><rect x="44" y="105" width="1512" height="545" rx="8" fill="#fafbfc" stroke="#d0d5dd"/><text x="64" y="135" class="lane">身份权限与审计流程</text></g><g><rect x="70" y="260" width="220" height="105" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="70" y="260" width="7" height="105" rx="3" fill="#4f8fc5"/><text x="180" y="290" text-anchor="middle" class="node-title"><tspan x="180" dy="0">同步 / 维护组织用户</tspan></text><text x="180" y="313" text-anchor="middle" class="node-sub"><tspan x="180" dy="0">IAM、组织、岗位、账号状态</tspan></text></g><g><polygon points="440,254 530,312 440,370 350,312" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><text x="440" y="307" text-anchor="middle" class="decision"><tspan x="440" dy="0">用户是否</tspan><tspan x="440" dy="21">存在未完成待办？</tspan></text></g><g><rect x="570" y="180" width="220" height="90" rx="7" fill="#fff7e8" stroke="#d59b2d" stroke-width="2"/><rect x="570" y="180" width="7" height="90" rx="3" fill="#d59b2d"/><text x="680" y="210" text-anchor="middle" class="node-title"><tspan x="680" dy="0">转派未完成待办</tspan></text><text x="680" y="233" text-anchor="middle" class="node-sub"><tspan x="680" dy="0">停用用户前置</tspan></text></g><g><rect x="570" y="345" width="220" height="90" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="570" y="345" width="7" height="90" rx="3" fill="#4f8fc5"/><text x="680" y="375" text-anchor="middle" class="node-title"><tspan x="680" dy="0">分配角色</tspan></text><text x="680" y="398" text-anchor="middle" class="node-sub"><tspan x="680" dy="0">用户与角色关系</tspan></text></g><g><rect x="850" y="345" width="220" height="90" rx="7" fill="#f3f8fd" stroke="#4f8fc5" stroke-width="2"/><rect x="850" y="345" width="7" height="90" rx="3" fill="#4f8fc5"/><text x="960" y="375" text-anchor="middle" class="node-title"><tspan x="960" dy="0">配置权限</tspan></text><text x="960" y="398" text-anchor="middle" class="node-sub"><tspan x="960" dy="0">菜单、按钮、组织</tspan><tspan x="960" dy="18">字段、关系、证据</tspan></text></g><g><rect x="1130" y="345" width="220" height="90" rx="7" fill="#fff1f1" stroke="#d45454" stroke-width="2"/><rect x="1130" y="345" width="7" height="90" rx="3" fill="#d45454"/><text x="1240" y="375" text-anchor="middle" class="node-title"><tspan x="1240" dy="0">服务端权限校验</tspan></text><text x="1240" y="398" text-anchor="middle" class="node-sub"><tspan x="1240" dy="0">访问与操作时实时执行</tspan></text></g><g><rect x="1130" y="180" width="220" height="90" rx="7" fill="#eef8f2" stroke="#4c9a6a" stroke-width="2"/><rect x="1130" y="180" width="7" height="90" rx="3" fill="#4c9a6a"/><text x="1240" y="210" text-anchor="middle" class="node-title"><tspan x="1240" dy="0">生成审计记录</tspan></text><text x="1240" y="233" text-anchor="middle" class="node-sub"><tspan x="1240" dy="0">前后值、原因、IP、trace_id</tspan></text></g><g><rect x="1390" y="260" width="150" height="105" rx="7" fill="#f7f8fa" stroke="#98a2b3" stroke-width="2"/><rect x="1390" y="260" width="7" height="105" rx="3" fill="#98a2b3"/><text x="1465" y="290" text-anchor="middle" class="node-title"><tspan x="1465" dy="0">查询审计日志</tspan></text><text x="1465" y="313" text-anchor="middle" class="node-sub"><tspan x="1465" dy="0">详情、对象、链路</tspan></text></g><g><path d="M290 312 L350 312" class="edge"/></g><g><path d="M440 254 C480 220 520 225 570 225" class="edge-red"/><rect x="492" y="208" width="56" height="22" rx="11" fill="#fff"/><text x="520" y="223" text-anchor="middle" class="label">是</text></g><g><path d="M440 370 C480 390 520 390 570 390" class="edge"/><rect x="492" y="373" width="56" height="22" rx="11" fill="#fff"/><text x="520" y="388" text-anchor="middle" class="label">否</text></g><g><path d="M680 270 L680 345" class="edge"/><rect x="682" y="293" width="56" height="22" rx="11" fill="#fff"/><text x="710" y="308" text-anchor="middle" class="label">完成转派</text></g><g><path d="M790 390 L850 390" class="edge"/></g><g><path d="M1070 390 L1130 390" class="edge"/></g><g><path d="M1240 345 L1240 270" class="edge"/><rect x="1242" y="293" width="56" height="22" rx="11" fill="#fff"/><text x="1270" y="308" text-anchor="middle" class="label">关键操作</text></g><g><path d="M1350 225 L1390 312" class="edge"/></g><g><path d="M1465 365 C1465 560 960 570 960 435" class="edge-dash"/><rect x="1182" y="553" width="56" height="22" rx="11" fill="#fff"/><text x="1210" y="568" text-anchor="middle" class="label">审计追踪</text></g><text x="70" y="690" text-anchor="start" class="note"><tspan x="70" dy="0">权限必须由服务端强制执行；审计记录只读不可删除；导出审计日志的行为也需要记录。</tspan></text>
</svg>
