<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">穿透式监管智能应用平台功能架构图</title>
  <desc id="desc">按六个一级模块展示当前工程页面、路由和核心功能，并展示横向公共能力。</desc>
  <defs><style>
    text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1f2937;letter-spacing:0}.title{font-size:30px;font-weight:700;fill:#111827}.sub{font-size:15px;fill:#667085}.band{font-size:17px;font-weight:700;fill:#344054}.module{font-size:22px;font-weight:700;fill:#fff}.section{font-size:17px;font-weight:700}.item{font-size:15px;fill:#475467}.route{font-family:Consolas,"Microsoft YaHei",monospace;font-size:13px;fill:#1769aa}.tag{font-size:12px;font-weight:700}
  </style></defs>
  <rect width="1600" height="1160" fill="#fff"/>
  <text x="64" y="54" class="title">穿透式监管智能应用平台｜功能架构</text><text x="64" y="82" class="sub">六个一级模块与当前工程页面 / 路由对齐；成熟度沿用 PRD 的 L3 / L2 / L1 定义</text>
  <rect x="48" y="110" width="1504" height="64" rx="6" fill="#f5f9ff" stroke="#8cb8df"/><text x="70" y="149" class="band">统一 PC Web 门户</text><text x="264" y="149" class="item">菜单导航 ｜ 详情 / 编辑路由 ｜ 上下文返回 ｜ 统一交互反馈</text>
  <rect x="48" y="190" width="1504" height="82" rx="6" fill="#f8fafc" stroke="#aab7c4"/><text x="70" y="221" class="band">横向公共能力</text><text x="70" y="250" class="item">全局搜索 ｜ 角色与组织数据范围 ｜ 消息与待办 ｜ 统一审计 / trace_id ｜ 上下文监管智能体（辅助说明，不直接执行监管动作）</text>

  <g transform="translate(48 300)"><rect width="480" height="354" rx="6" fill="#fff" stroke="#8cb8df" stroke-width="2"/><rect width="480" height="62" rx="6" fill="#347fb8"/><rect y="56" width="480" height="6" fill="#347fb8"/><text x="24" y="39" class="module">监管工作台</text><rect x="392" y="20" width="62" height="24" rx="12" fill="#fff5df"/><text x="423" y="37" text-anchor="middle" class="tag" fill="#9b6400">L2</text><text x="24" y="94" class="section">工作台首页</text><text x="24" y="119" class="route">/workbench</text><line x1="24" y1="137" x2="456" y2="137" stroke="#e4e7ec"/><text x="24" y="171" class="item">• 统计卡：待研判、待整改、待复核、逾期</text><text x="24" y="205" class="item">• 我的待办：查询、查看、处理、转派</text><text x="24" y="239" class="item">• 消息接收框：未读、已读、来源跳转</text><text x="24" y="283" class="section">核心定位</text><text x="24" y="314" class="item">登录后的监管任务入口与个人工作聚合</text><rect x="24" y="326" width="192" height="20" rx="10" fill="#fff5df"/><text x="120" y="340" text-anchor="middle" class="tag" fill="#9b6400">部分流程使用本地状态</text></g>
  <g transform="translate(560 300)"><rect width="480" height="354" rx="6" fill="#fff" stroke="#8cb8df" stroke-width="2"/><rect width="480" height="62" rx="6" fill="#347fb8"/><rect y="56" width="480" height="6" fill="#347fb8"/><text x="24" y="39" class="module">监管态势</text><rect x="392" y="20" width="62" height="24" rx="12" fill="#fff5df"/><text x="423" y="37" text-anchor="middle" class="tag" fill="#9b6400">L2</text><text x="24" y="94" class="section">监管态势总览</text><text x="24" y="119" class="route">/situation</text><line x1="24" y1="137" x2="456" y2="137" stroke="#e4e7ec"/><text x="24" y="171" class="item">• 核心指标：风险规模、等级、状态与时效</text><text x="24" y="205" class="item">• 趋势分析：时间变化与风险阶段</text><text x="24" y="239" class="item">• 分布分析：组织、领域、场景与对象</text><text x="24" y="273" class="item">• 下钻联动：跳转至预警 / 事件列表</text><text x="24" y="317" class="section">核心定位</text><text x="24" y="344" class="item">面向领导和监管负责人的全局观察窗口</text></g>
  <g transform="translate(1072 300)"><rect width="480" height="354" rx="6" fill="#fff" stroke="#d59b2d" stroke-width="2"/><rect width="480" height="62" rx="6" fill="#c98724"/><rect y="56" width="480" height="6" fill="#c98724"/><text x="24" y="39" class="module">风险监管</text><rect x="392" y="20" width="62" height="24" rx="12" fill="#fff5df"/><text x="423" y="37" text-anchor="middle" class="tag" fill="#9b6400">L2</text><text x="24" y="94" class="section">统一预警</text><text x="24" y="119" class="route">/risk/warnings　/risk/warnings/:id</text><text x="24" y="151" class="item">列表、详情、证据图、来源、转派、解除、升级</text><line x1="24" y1="172" x2="456" y2="172" stroke="#e4e7ec"/><text x="24" y="207" class="section">风险事件</text><text x="24" y="232" class="route">/risk/events　/risk/events/:id</text><text x="24" y="264" class="item">整改提交、复核通过、退回整改、关闭与留痕</text><line x1="24" y1="285" x2="456" y2="285" stroke="#e4e7ec"/><text x="24" y="318" class="item">预警：待研判 → 已解除 / 已升级</text><text x="24" y="344" class="item">事件：待整改 ⇄ 待复核 → 已关闭</text></g>

  <g transform="translate(48 682)"><rect width="480" height="354" rx="6" fill="#fff" stroke="#4c9a6a" stroke-width="2"/><rect width="480" height="62" rx="6" fill="#31834f"/><rect y="56" width="480" height="6" fill="#31834f"/><text x="24" y="39" class="module">场景与规则</text><rect x="392" y="20" width="62" height="24" rx="12" fill="#e8f5ee"/><text x="423" y="37" text-anchor="middle" class="tag" fill="#247141">L3</text><text x="24" y="94" class="section">风险场景</text><text x="24" y="119" class="route">/scenes　/scenes/:id</text><text x="24" y="151" class="item">场景版本、范围、目标事件、证据、制度、发布</text><line x1="24" y1="172" x2="456" y2="172" stroke="#e4e7ec"/><text x="24" y="207" class="section">规则管理</text><text x="24" y="232" class="route">/rules　/rules/:id</text><text x="24" y="264" class="item">规则资产、独立版本、条件编辑、绑定、校验与试跑</text><line x1="24" y1="285" x2="456" y2="285" stroke="#e4e7ec"/><text x="24" y="318" class="item">规则版本可复用，并被多个场景版本引用</text><rect x="24" y="326" width="150" height="20" rx="10" fill="#e8f5ee"/><text x="99" y="340" text-anchor="middle" class="tag" fill="#247141">主要能力已落库</text></g>
  <g transform="translate(560 682)"><rect width="480" height="354" rx="6" fill="#fff" stroke="#4c9a6a" stroke-width="2"/><rect width="480" height="62" rx="6" fill="#31834f"/><rect y="56" width="480" height="6" fill="#31834f"/><text x="24" y="39" class="module">本体与图谱</text><rect x="392" y="20" width="62" height="24" rx="12" fill="#e8f5ee"/><text x="423" y="37" text-anchor="middle" class="tag" fill="#247141">L3</text><text x="24" y="94" class="section">本体管理</text><text x="24" y="119" class="route">/ontology　/ontology/:id</text><text x="24" y="149" class="item">类、属性、关系、事件、约束与版本发布</text><text x="24" y="185" class="section">数据接入</text><text x="24" y="210" class="route">/data-access...</text><text x="24" y="240" class="item">数据源、元数据、语义映射、校验与质量结果</text><text x="24" y="276" class="section">图谱管理</text><text x="24" y="301" class="route">/graphs...</text><text x="24" y="331" class="item">图谱版本、新建 / 编辑、来源范围与治理</text></g>
  <g transform="translate(1072 682)"><rect width="480" height="354" rx="6" fill="#fff" stroke="#d59b2d" stroke-width="2"/><rect width="480" height="62" rx="6" fill="#7a5b22"/><rect y="56" width="480" height="6" fill="#7a5b22"/><text x="24" y="39" class="module">系统管理</text><rect x="392" y="20" width="62" height="24" rx="12" fill="#fff5df"/><text x="423" y="37" text-anchor="middle" class="tag" fill="#9b6400">L2</text><text x="24" y="99" class="section">用户与组织</text><text x="260" y="99" class="route">/system/users</text><line x1="24" y1="119" x2="456" y2="119" stroke="#e4e7ec"/><text x="24" y="157" class="section">角色与权限</text><text x="260" y="157" class="route">/system/roles</text><line x1="24" y1="177" x2="456" y2="177" stroke="#e4e7ec"/><text x="24" y="215" class="section">审计日志</text><text x="260" y="215" class="route">/system/audit</text><line x1="24" y1="235" x2="456" y2="235" stroke="#e4e7ec"/><text x="24" y="271" class="item">用户、角色、菜单与页面已具备交互基线</text><text x="24" y="302" class="item">试点前补齐服务端授权、数据权限与统一审计</text><rect x="24" y="326" width="122" height="20" rx="10" fill="#fff0f0"/><text x="85" y="340" text-anchor="middle" class="tag" fill="#a32d2d">试点前置加固</text></g>

  <rect x="48" y="1064" width="1504" height="66" rx="6" fill="#f8fafc" stroke="#d0d5dd"/><text x="70" y="1104" class="band">成熟度</text><rect x="170" y="1084" width="46" height="24" rx="12" fill="#e8f5ee"/><text x="193" y="1101" text-anchor="middle" class="tag" fill="#247141">L3</text><text x="228" y="1102" class="item">已实现并持久化</text><rect x="430" y="1084" width="46" height="24" rx="12" fill="#fff5df"/><text x="453" y="1101" text-anchor="middle" class="tag" fill="#9b6400">L2</text><text x="488" y="1102" class="item">部分实现或使用本地 / 演示状态</text><rect x="850" y="1084" width="46" height="24" rx="12" fill="#f2f4f7"/><text x="873" y="1101" text-anchor="middle" class="tag">L1</text><text x="908" y="1102" class="item">已设计，尚未形成可验证工程能力</text>
</svg>
