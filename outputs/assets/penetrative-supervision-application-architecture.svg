<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">穿透式监管智能应用平台应用架构图</title>
  <desc id="desc">展示用户层、接入与安全层、业务应用层、数据层和外部系统层，以及当前实现和试点前置能力。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347fb8"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667085"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1f2937;letter-spacing:0}.title{font-size:30px;font-weight:700;fill:#111827}.sub{font-size:15px;fill:#667085}.layer{font-size:17px;font-weight:700;fill:#344054}.h{font-size:18px;font-weight:700}.p{font-size:14px;fill:#667085}.tag{font-size:12px;font-weight:700}.arrow{stroke:#347fb8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#667085;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrowGray)}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#fff"/>
  <text x="64" y="54" class="title">穿透式监管智能应用平台｜应用架构</text>
  <text x="64" y="82" class="sub">私有化 / 混合部署；按当前工程能力与试点前置要求分层呈现</text>
  <g transform="translate(1050 42)">
    <rect width="112" height="27" rx="4" fill="#e8f5ee" stroke="#4c9a6a"/><circle cx="15" cy="13.5" r="5" fill="#31834f"/><text x="27" y="18" class="tag" fill="#247141">当前已落库</text>
    <rect x="122" width="112" height="27" rx="4" fill="#fff5df" stroke="#d59b2d"/><circle cx="137" cy="13.5" r="5" fill="#c78410"/><text x="149" y="18" class="tag" fill="#9b6400">部分实现</text>
    <rect x="244" width="112" height="27" rx="4" fill="#fff0f0" stroke="#d45454"/><circle cx="259" cy="13.5" r="5" fill="#c43d3d"/><text x="271" y="18" class="tag" fill="#a32d2d">试点前置</text>
    <rect x="366" width="104" height="27" rx="4" fill="#f2f4f7" stroke="#98a2b3"/><circle cx="381" cy="13.5" r="5" fill="#667085"/><text x="393" y="18" class="tag">外部系统</text>
  </g>

  <rect x="48" y="110" width="1504" height="112" rx="6" fill="#f8fafc" stroke="#d0d5dd"/><text x="68" y="140" class="layer">用户层</text>
  <g fill="#fff" stroke="#98a2b3">
    <rect x="185" y="144" width="225" height="55" rx="5"/><rect x="430" y="144" width="225" height="55" rx="5"/><rect x="675" y="144" width="225" height="55" rx="5"/><rect x="920" y="144" width="225" height="55" rx="5"/><rect x="1165" y="144" width="250" height="55" rx="5"/>
  </g>
  <text x="297" y="178" text-anchor="middle" class="h">集团领导</text><text x="542" y="178" text-anchor="middle" class="h">监管人员</text><text x="787" y="178" text-anchor="middle" class="h">业务责任人</text><text x="1032" y="169" text-anchor="middle" class="h">本体 / 规则 / 数据</text><text x="1032" y="190" text-anchor="middle" class="p">管理员</text><text x="1290" y="178" text-anchor="middle" class="h">安全 / 系统管理员</text>

  <path d="M800 222V247" class="arrow"/>
  <rect x="48" y="252" width="1504" height="124" rx="6" fill="#f5f9ff" stroke="#8cb8df"/><text x="68" y="282" class="layer">接入与安全层</text>
  <rect x="220" y="294" width="500" height="58" rx="5" fill="#fff" stroke="#4f8fc5"/><text x="470" y="319" text-anchor="middle" class="h">PC Web 统一入口</text><text x="470" y="341" text-anchor="middle" class="p">React 19 + TypeScript + Vite</text>
  <rect x="880" y="294" width="500" height="58" rx="5" fill="#fff0f0" stroke="#d45454" stroke-width="2"/><text x="1130" y="319" text-anchor="middle" class="h">统一认证与服务端权限校验</text><text x="1130" y="341" text-anchor="middle" class="p">RBAC、组织范围、按钮 / 字段 / 关系 / 证据权限</text><path d="M720 323H880" class="arrow"/>

  <path d="M800 376V401" class="arrow"/>
  <rect x="48" y="406" width="1504" height="302" rx="6" fill="#f9fbfd" stroke="#aab7c4"/><text x="68" y="436" class="layer">业务应用层</text>
  <g>
    <g transform="translate(102 458)"><rect width="215" height="104" rx="5" fill="#fff" stroke="#4f8fc5"/><rect width="215" height="8" rx="4" fill="#347fb8"/><text x="107" y="43" text-anchor="middle" class="h">监管工作台</text><text x="107" y="69" text-anchor="middle" class="p">统计 · 待办 · 消息</text><rect x="17" y="78" width="72" height="20" rx="10" fill="#fff5df"/><text x="53" y="92" text-anchor="middle" class="tag" fill="#9b6400">部分实现</text></g>
    <g transform="translate(338 458)"><rect width="215" height="104" rx="5" fill="#fff" stroke="#4f8fc5"/><rect width="215" height="8" rx="4" fill="#347fb8"/><text x="107" y="43" text-anchor="middle" class="h">监管态势</text><text x="107" y="69" text-anchor="middle" class="p">指标 · 趋势 · 分布 · 下钻</text><rect x="17" y="78" width="72" height="20" rx="10" fill="#fff5df"/><text x="53" y="92" text-anchor="middle" class="tag" fill="#9b6400">部分实现</text></g>
    <g transform="translate(574 458)"><rect width="215" height="104" rx="5" fill="#fff" stroke="#d59b2d"/><rect width="215" height="8" rx="4" fill="#d59b2d"/><text x="107" y="43" text-anchor="middle" class="h">风险监管</text><text x="107" y="69" text-anchor="middle" class="p">预警研判 · 整改复核</text><rect x="17" y="78" width="72" height="20" rx="10" fill="#fff5df"/><text x="53" y="92" text-anchor="middle" class="tag" fill="#9b6400">部分实现</text></g>
    <g transform="translate(810 458)"><rect width="215" height="104" rx="5" fill="#fff" stroke="#4c9a6a"/><rect width="215" height="8" rx="4" fill="#4c9a6a"/><text x="107" y="43" text-anchor="middle" class="h">场景与规则</text><text x="107" y="69" text-anchor="middle" class="p">场景版本 · 规则资产 · 试跑</text><rect x="17" y="78" width="72" height="20" rx="10" fill="#e8f5ee"/><text x="53" y="92" text-anchor="middle" class="tag" fill="#247141">已落库</text></g>
    <g transform="translate(1046 458)"><rect width="215" height="104" rx="5" fill="#fff" stroke="#4c9a6a"/><rect width="215" height="8" rx="4" fill="#4c9a6a"/><text x="107" y="43" text-anchor="middle" class="h">本体与图谱</text><text x="107" y="69" text-anchor="middle" class="p">本体 · 映射 · 图谱版本</text><rect x="17" y="78" width="72" height="20" rx="10" fill="#e8f5ee"/><text x="53" y="92" text-anchor="middle" class="tag" fill="#247141">已落库</text></g>
    <g transform="translate(1282 458)"><rect width="215" height="104" rx="5" fill="#fff" stroke="#d59b2d"/><rect width="215" height="8" rx="4" fill="#d59b2d"/><text x="107" y="43" text-anchor="middle" class="h">系统管理</text><text x="107" y="69" text-anchor="middle" class="p">用户 · 角色 · 权限 · 审计</text><rect x="17" y="78" width="72" height="20" rx="10" fill="#fff5df"/><text x="53" y="92" text-anchor="middle" class="tag" fill="#9b6400">部分实现</text></g>
  </g>
  <rect x="102" y="588" width="1395" height="88" rx="5" fill="#eef4fa" stroke="#7b9fbd" stroke-dasharray="7 5"/><text x="129" y="619" class="h">横向辅助能力</text><text x="129" y="649" class="p">全局搜索 ｜ 消息与待办聚合 ｜ 操作审计与 trace_id ｜ 监管智能体（仅页面说明、问答和操作建议，不执行监管动作）</text><rect x="1385" y="604" width="92" height="22" rx="11" fill="#eef4fa" stroke="#4f8fc5"/><text x="1431" y="620" text-anchor="middle" class="tag" fill="#1769aa">辅助能力</text>

  <path d="M800 708V733" class="arrow"/>
  <rect x="48" y="738" width="1504" height="166" rx="6" fill="#f8fafc" stroke="#aab7c4"/><text x="68" y="768" class="layer">数据与基础能力层</text>
  <rect x="116" y="789" width="408" height="86" rx="5" fill="#e8f5ee" stroke="#4c9a6a" stroke-width="2"/><text x="320" y="820" text-anchor="middle" class="h">MySQL 持久化</text><text x="320" y="846" text-anchor="middle" class="p">本体、场景规则、数据源、映射、图谱资产</text>
  <rect x="542" y="789" width="408" height="86" rx="5" fill="#fff5df" stroke="#d59b2d" stroke-width="2"/><text x="746" y="820" text-anchor="middle" class="h">浏览器本地状态</text><text x="746" y="846" text-anchor="middle" class="p">当前部分工作台、风险闭环、权限与审计状态</text>
  <rect x="968" y="789" width="516" height="86" rx="5" fill="#fff0f0" stroke="#d45454" stroke-width="2"/><text x="1226" y="820" text-anchor="middle" class="h">独立证据快照与统一审计存储</text><text x="1226" y="846" text-anchor="middle" class="p">不可覆盖、内容哈希、事务闭环、前后值、IP 与 trace_id</text>

  <path d="M320 964V904" class="dash"/><path d="M800 964V904" class="dash"/><path d="M1280 964V904" class="dash"/>
  <rect x="48" y="964" width="1504" height="88" rx="6" fill="#f2f4f7" stroke="#98a2b3"/><text x="68" y="994" class="layer">外部系统层</text>
  <rect x="160" y="988" width="340" height="43" rx="5" fill="#fff" stroke="#98a2b3"/><text x="330" y="1016" text-anchor="middle" class="h">ERP / OA / 业务系统</text>
  <rect x="630" y="988" width="340" height="43" rx="5" fill="#fff" stroke="#98a2b3"/><text x="800" y="1016" text-anchor="middle" class="h">IAM / 组织 / 主数据</text>
  <rect x="1100" y="988" width="340" height="43" rx="5" fill="#fff" stroke="#98a2b3"/><text x="1270" y="1016" text-anchor="middle" class="h">文档 / 外部数据服务</text>
</svg>
